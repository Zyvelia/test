name: charchat
description: CharChat — character chat with Ollama
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  uuid: ^4.3.3
  http: ^1.2.1
  provider: ^6.1.2
  path_provider: ^2.1.3
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.6.22
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
