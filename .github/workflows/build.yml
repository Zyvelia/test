name: Build Aurora Client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build client
        run: bash ./gradlew build --no-daemon --console=plain
      - name: Upload installable client
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Client-Minecraft-1.21.1
          path: build/libs/aurora-client-0.1.0.jar
          if-no-files-found: error
