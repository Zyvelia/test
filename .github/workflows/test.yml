name: Test Vivi (Windows and Linux)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate Linux launch scripts
        if: runner.os == 'Linux'
        run: bash -n setup.sh start.sh verify.sh install-startup.sh remove-startup.sh
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build -t vivi:ci .
      - name: Check container imports and private runtime directory
        run: |
          docker run --rm --network none vivi:ci python -c "import os; from pathlib import Path; from vivi.storage import Store; from vivi.community import card_bytes; assert os.getuid() == 10001; assert not Path('/app/.env').exists(); s=Store('/app/data/ci.sqlite3'); s.set_option(1,'language','es'); assert s.history(1); assert card_bytes('Member','Server','Preview','#87CEEB').startswith(bytes.fromhex('89504e47')); s.close()"
      - name: Check encrypted recovery inside the image
        run: |
          docker run --rm -i --network none vivi:ci python - <<'PY'
          import tempfile
          from pathlib import Path
          from vivi.storage import Store
          from vivi.backup import generate_key, create, restore
          with tempfile.TemporaryDirectory() as temporary:
              temporary = Path(temporary)
              store = Store('/app/data/recovery.sqlite3')
              store.warn(1, 2, 3, 'Recovery test')
              key = generate_key(temporary / 'private.key')
              archive = create('/app', store.path, key)
              restored = restore(archive, key, temporary / 'restored', '/app')
              assert (restored / 'data/recovery.sqlite3').exists()
              store.close()
          PY
