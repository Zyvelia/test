name: Test Vivi (Windows and Linux)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate Linux launch scripts
        if: runner.os == 'Linux'
        run: bash -n setup.sh start.sh verify.sh install-startup.sh remove-startup.sh
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
